name: Synchronisation du calendrier

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les calendriers iCal
        env:
          ICAL_URLS: ${{ secrets.ICAL_URLS }}
        run: python scripts/sync_ical.py
      - name: Publier si le calendrier a changé
        run: |
          # Le champ "updated" change à chaque exécution : on ne commit que si les périodes ont changé.
          if git diff --quiet -I'"updated"' -- data/availability.json; then
            echo "Aucun changement."
          else
            git config user.name "calendar-bot"
            git config user.email "calendar-bot@users.noreply.github.com"
            git add data/availability.json
            git commit -m "Mise à jour automatique du calendrier"
            git push
          fi
